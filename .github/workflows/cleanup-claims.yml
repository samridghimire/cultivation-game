name: cleanup-claims
# Deletes claude/* claim branches whose task landed on main or that went stale (tools/cleanup_claims.sh).
# Cloud agents can't delete remote branches, so this runs hourly.
on:
  schedule:
    - cron: "20 * * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: bash tools/cleanup_claims.sh
